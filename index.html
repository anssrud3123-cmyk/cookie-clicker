<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승현님 잘 먹겠습니다 </title>
    <style>
        body {
            background-color: #2c221e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            user-select: none;
            overflow: hidden;
            color: #fdf5e6;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 28px;
        }
        #score-board {
            font-size: 22px;
            color: #ffb347;
            margin-bottom: 40px;
            font-weight: bold;
        }
        #cookie-container {
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 300px;
            height: 300px;
        }
        /* 쿠키 이미지 스타일 */
        #cookie {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.08s ease, filter 0.1s ease;
        }
        #cookie:active {
            transform: scale(0.9) rotate(-3deg);
        }
        /* 냠냠 효과 글자 */
        .bite-text {
            position: absolute;
            font-size: 22px;
            font-weight: bold;
            color: #ff6b6b;
            animation: floatUp 0.5s ease-out forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }
        .progress-bar-container {
            width: 250px;
            height: 15px;
            background-color: #4a3b32;
            border-radius: 10px;
            margin-top: 30px;
            overflow: hidden;
            border: 2px solid #5c473c;
        }
        #progress-bar {
            width: 100%;
            height: 100%;
            background-color: #ffb347;
            transition: width 0.1s ease;
        }
    </style>
</head>
<body>

    <h1> 승현님 잘 먹겠습니다 </h1>
    <div id="score-board">먹은 조각: <span id="score">0</span>개</div>
    
    <div id="cookie-container" onclick="biteCookie(event)">
        <!-- 쿠키 이미지 파일 이름을 cookie.png 로 같은 폴더에 넣어주세요! -->
        <img id="cookie" src="cookie.png" alt="두쫀쿠" onerror="this.src='https://via.placeholder.com/250/5c3a21/ffffff?text=Cookie+Img'">
    </div>

    <div class="progress-bar-container">
        <div id="progress-bar"></div>
    </div>
    <p style="font-size: 13px; color: #a89f91; margin-top: 10px;">마싯노!</p>

    <script>
        let score = 0;
        let durability = 100; // 쿠키 체력(100번 클릭하면 다 먹음)
        
        const scoreElement = document.getElementById('score');
        const cookieElement = document.getElementById('cookie');
        const progressBar = document.getElementById('progress-bar');
        const container = document.getElementById('cookie-container');

        function biteCookie(event) {
            score++;
            scoreElement.innerText = score;

            // 체력 깎이기 (클릭당 5%씩 닳음 = 20번 클릭하면 한 개 뚝딱)
            durability -= 5;
            if (durability <= 0) {
                durability = 100; // 다 먹으면 새로운 쿠키 리필!
                playPopEffect("야르!", event);
            } else {
                playPopEffect("야르", event);
            }

            // 게이지바 업데이트 및 살짝 작아지는 베어먹힌 연출
            progressBar.style.width = durability + '%';
            cookieElement.style.transform = `scale(${0.8 + (durability / 500)})`;
            setTimeout(() => {
                cookieElement.style.transform = 'scale(1)';
            }, 80);
        }

        function playPopEffect(text, event) {
            const rect = container.getBoundingClientRect();
            const x = event.clientX - rect.left - 40;
            const y = event.clientY - rect.top - 40;

            const pop = document.createElement('div');
            pop.classList.add('bite-text');
            pop.innerText = text;
            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;
            
            container.appendChild(pop);
            setTimeout(() => pop.remove(), 500);
        }
    </script>

</body>
</html>
